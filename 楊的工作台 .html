        document.addEventListener('DOMContentLoaded', function() {
            const gridContainer = document.getElementById('toolGrid');
            const paginationContainer = document.getElementById('pagination');
            const searchInput = document.getElementById('searchInput');
            const filterBtns = document.querySelectorAll('.filter-btn');
            
            let currentCategory = 'all';
            let currentQuery = '';
            let currentPage = 1;
            const itemsPerPage = 16; // 调整为每页16条，更适合2列布局

            // 本地存储收藏功能
            function getFavorites() {
                try {
                    const favs = localStorage.getItem('plant_bioinfo_favorites');
                    return favs ? JSON.parse(favs) : [];
                } catch (e) {
                    console.error('读取收藏列表失败:', e);
                    localStorage.removeItem('plant_bioinfo_favorites');
                    return [];
                }
            }

            function saveFavorites(favs) {
                try {
                    localStorage.setItem('plant_bioinfo_favorites', JSON.stringify(favs));
                } catch (e) {
                    console.error('保存收藏列表失败:', e);
                }
            }

            function toggleFavorite(id) {
                let favs = getFavorites();
                if (favs.includes(id)) {
                    favs = favs.filter(fid => fid !== id);
                } else {
                    favs.push(id);
                }
                saveFavorites(favs);
                renderTools();
            }

            // 数据过滤和排序
            function getProcessedData() {
                const favs = getFavorites();
                let data = tools.filter(item => {
                    const matchCat = currentCategory === 'all' || item.category === currentCategory;
                    const lowerQuery = currentQuery.toLowerCase();
                    const matchText = item.name.toLowerCase().includes(lowerQuery) ||
                                      (item.description && item.description.toLowerCase().includes(lowerQuery)) ||
                                      (item.tags && item.tags.some(t => t.toLowerCase().includes(lowerQuery)));
                    return matchCat && matchText;
                });

                // 收藏的工具置顶
                data.sort((a, b) => {
                    const aFav = favs.includes(a.id);
                    const bFav = favs.includes(b.id);
                    if (aFav && !bFav) return -1;
                    if (!aFav && bFav) return 1;
                    return a.id - b.id; // 按ID升序排列
                });

                return data;
            }

            // 渲染分页
            function renderPagination(totalItems) {
                paginationContainer.innerHTML = '';
                const totalPages = Math.ceil(totalItems / itemsPerPage);

                if (totalPages <= 1) return;

                // 上一页
                const prevLi = document.createElement('li');
                prevLi.className = `page-item ${currentPage === 1 ? 'disabled' : ''}`;
                prevLi.innerHTML = '<a class="page-link" href="#" tabindex="-1">上一页</a>';
                prevLi.addEventListener('click', e => {
                    e.preventDefault();
                    if (currentPage > 1) {
                        currentPage--;
                        renderTools();
                    }
                });
                paginationContainer.appendChild(prevLi);

                // 页码
                for (let i = 1; i <= totalPages; i++) {
                    const li = document.createElement('li');
                    li.className = `page-item ${currentPage === i ? 'active' : ''}`;
                    li.innerHTML = `<a class="page-link" href="#">${i}</a>`;
                    li.addEventListener('click', e => {
                        e.preventDefault();
                        currentPage = i;
                        renderTools();
                    });
                    paginationContainer.appendChild(li);
                }

                // 下一页
                const nextLi = document.createElement('li');
                nextLi.className = `page-item ${currentPage === totalPages ? 'disabled' : ''}`;
                nextLi.innerHTML = '<a class="page-link" href="#">下一页</a>';
                nextLi.addEventListener('click', e => {
                    e.preventDefault();
                    if (currentPage < totalPages) {
                        currentPage++;
                        renderTools();
                    }
                });
                paginationContainer.appendChild(nextLi);
            }

            // 渲染工具卡片
            function renderTools() {
                gridContainer.innerHTML = '';
                const favs = getFavorites();
                const fullData = getProcessedData();
                const startIndex = (currentPage - 1) * itemsPerPage;
                const endIndex = startIndex + itemsPerPage;
                const pageData = fullData.slice(startIndex, endIndex);

                if (pageData.length === 0) {
                    gridContainer.innerHTML = '<div class="col-12 text-center text-muted py-5">未找到匹配的工具，请尝试其他关键词或分类</div>';
                    renderPagination(fullData.length);
                    return;
                }

                pageData.forEach(tool => {
                    const isFav = favs.includes(tool.id);
                    const col = document.createElement('div');
                    col.className = 'col';
                    col.innerHTML = `
                        <div class="card tool-card ${isFav ? 'pinned' : ''}">
                            <div class="card-header">
                                <div class="flex-grow-1">
                                    <h5 class="tool-title">${tool.name}</h5>
                                    <a href="${tool.url}" target="_blank" class="tool-link">${tool.url}</a>
                                </div>
                                <button class="star-btn ${isFav ? 'filled' : ''}" title="${isFav ? '取消置顶' : '置顶收藏'}">
                                    <i class="fas fa-star"></i>
                                </button>
                            </div>
                            <div class="card-body">
                                <p class="tool-desc">${tool.description}</p>
                                <div>
                                    ${tool.tags.map(tag => `<span class="tag-badge">${tag}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                    `;

                    // 绑定收藏按钮事件
                    const starBtn = col.querySelector('.star-btn');
                    starBtn.addEventListener('click', () => toggleFavorite(tool.id));

                    gridContainer.appendChild(col);
                });

                renderPagination(fullData.length);
            }

            // 搜索功能
            searchInput.addEventListener('input', e => {
                currentQuery = e.target.value.trim();
                currentPage = 1;
                renderTools();
            });

            // 分类筛选功能
            filterBtns.forEach(btn => {
                btn.addEventListener('click', e => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.dataset.category || 'all';
                    currentPage = 1;
                    renderTools();
                });
            });

            // 初始渲染
            renderTools();
        });
    </script>
